<body>
<div class="bg-texture"></div>
<header id="site-nav" data-active="home"></header>

<main>
  <section class="hero">
    <div class="hero-copy">
      <p class="eyebrow">State Banquet</p>
      <h1 class="i18n" data-zh="赫斯維爾國宴" data-en="State Banquet of Hershwell">赫斯維爾國宴</h1>
      <p class="hero-text i18n" data-zh="謹以大公殿下之名，迎候諸邦貴賓。此宴承襲赫斯維爾典禮傳統，以莊重之儀、友誼之心，紀念國慶與邦交之誼。" data-en="In the name of His Serene Highness the Prince of Hershwell, honoured guests are received in ceremony and friendship, marking the National Day of Hershwell and the bonds among realms.">謹以大公殿下之名，迎候諸邦貴賓。此宴承襲赫斯維爾典禮傳統，以莊重之儀、友誼之心，紀念國慶與邦交之誼。</p>
      <div class="hero-actions">
        <a class="royal-link primary i18n" href="guest-list.html" data-zh="查看受邀賓客" data-en="View Guests">查看受邀賓客</a>
        <a class="royal-link i18n" href="state-banquet.html" data-zh="開啟邀請函" data-en="Open Invitation">開啟邀請函</a>
        <a class="royal-link i18n" href="public-invitation.html" data-zh="公開邀請函" data-en="Public Invitation">公開邀請函</a>
      </div>
    </div>
    <div class="flag-frame">
      <img src="assets/royal-flag.png" alt="赫斯維爾皇家旗" fetchpriority="high" decoding="async">
    </div>
  </section>

  <section class="event-details" aria-label="宴會資訊">
    <div class="event-detail">
      <span class="event-label i18n" data-zh="日期" data-en="Date">日期</span>
      <span class="event-value i18n" data-zh="二〇二六年七月三日<br>星期五 晚間七時三十分" data-en="Friday, 3 July 2026<br>7:30 p.m.">二〇二六年七月三日<br>星期五 晚間七時三十分</span>
    </div>
    <div class="event-detail">
      <span class="event-label i18n" data-zh="地點" data-en="Venue">地點</span>
      <span class="event-value i18n" data-zh="芬第夏宮<br>雅倫公爵領" data-en="Findeshia Palace<br>Duchy of Jallon">芬第夏宮<br>雅倫公爵領</span>
    </div>
    <div class="event-detail">
      <span class="event-label i18n" data-zh="聯絡" data-en="Contact">聯絡</span>
      <span class="event-value"><span class="i18n" data-zh="宮廷大臣辦公室" data-en="Office of the Grand Chamberlain">宮廷大臣辦公室</span><br><a href="mailto:gov.hershwell@gmail.com">gov.hershwell@gmail.com</a></span>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title i18n" data-zh="二〇二五年國宴回顧" data-en="Scenes from the 2025 State Banquet">二〇二五年國宴回顧</h2>
      <p class="section-note i18n" data-zh="禮儀、祝酒與賓客合影" data-en="Ceremony, toast, and honoured company">禮儀、祝酒與賓客合影</p>
    </div>
    <div class="photo-grid">
      <div class="photo-tile featured-photo"><button class="photo-button" type="button"><img src="assets/banquet-2025-group.webp" width="1080" height="722" alt="去年國宴賓客合影" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile"><button class="photo-button" type="button"><img src="assets/banquet-2025-certificate.webp" width="1080" height="722" alt="去年國宴授函儀式" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile"><button class="photo-button" type="button"><img src="assets/banquet-2025-toast.webp" width="1080" height="938" alt="去年國宴祝酒時刻" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile wide"><button class="photo-button" type="button"><img src="assets/banquet-2025-violin.webp" width="1920" height="1282" alt="去年國宴小提琴演奏" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile"><button class="photo-button" type="button"><img src="assets/banquet-2025-chess.webp" width="1920" height="1282" alt="去年國宴棋局時刻" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile"><button class="photo-button" type="button"><img src="assets/banquet-2025-celebration.webp" width="1920" height="1282" alt="去年國宴歡慶時刻" loading="lazy" decoding="async"></button></div>
      <div class="photo-tile wide"><button class="photo-button" type="button"><img src="assets/banquet-2025-reception.webp" width="1920" height="1282" alt="去年國宴宴會時刻" loading="lazy" decoding="async"></button></div>
    </div>
  </section>

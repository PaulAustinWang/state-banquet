<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赫斯維爾國宴 | 邀請函</title>
<meta name="description" content="選擇受邀賓客，開啟赫斯維爾國宴專屬邀請函。">
<meta name="theme-color" content="#6B1722">
<meta property="og:type" content="website">
<meta property="og:title" content="赫斯維爾國宴邀請函">
<meta property="og:description" content="於芬第夏宮舉行之赫斯維爾國宴專屬邀請函。">
<meta property="og:url" content="https://paulaustinwang.github.io/state-banquet/state-banquet.html">
<meta property="og:image" content="https://paulaustinwang.github.io/state-banquet/assets/royal-flag.png">
<link rel="canonical" href="https://paulaustinwang.github.io/state-banquet/state-banquet.html">
<link rel="icon" type="image/png" href="assets/state-banquet-nav.png">
<link rel="apple-touch-icon" href="assets/state-banquet-nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script defer src="assets/js/guests.js?v=20260701-4"></script>
<script defer src="assets/js/site.js"></script>
<script defer src="assets/js/invitation.js?v=20260701"></script>
</head>
<body>
<div class="bg-texture"></div>
<header id="site-nav" data-active="invitation"></header>

<main>
  <section class="guest-picker" id="guest-picker">
    <div class="guest-picker-card fade-up">
      <h1 class="guest-picker-title i18n" data-zh="請示尊銜" data-en="May we know whom we have the honour of receiving?">請示尊銜</h1>
      <div id="guest-choices"></div>
    </div>
  </section>

  <section class="invitation-wrap" id="invitation">
    <div class="invitation fade-up">
      <div class="inv-inner">
        <div class="crest-medallion">
          <img src="assets/state-banquet-crest.png" alt="赫斯維爾國宴徽章" class="crest-img">
        </div>

        <h1 class="title-cn i18n" data-zh="宮廷大臣" data-en="The Grand Chamberlain">宮廷大臣</h1>
        <div class="title-rule"></div>

        <p class="lede i18n" data-zh="當燈火升起，芬第夏宮燭光映照，金錦鋪席，玉杯陳列，謹以友誼之名迎接諸邦賓客。願今夜樂聲不絕、風儀長存，成為獻予尊貴來賓的一場盛典。" data-en="As the lanterns rise and the palace candles glow, the hall is set with cloth of gold and goblets of jade, to welcome guests from every realm in friendship. May this evening be one of unbroken music and lasting grace, a fitting tribute to the honoured and the noble.">當燈火升起，芬第夏宮燭光映照，金錦鋪席，玉杯陳列，謹以友誼之名迎接諸邦賓客。願今夜樂聲不絕、風儀長存，成為獻予尊貴來賓的一場盛典。</p>

        <p class="narrative"><span class="i18n" data-zh="奉殿下之命，謹此邀請" data-en="has received His Serene Highness's command to invite">奉殿下之命，謹此邀請</span></p>
        <span class="blank-line" id="guest-name-line"></span>
        <span class="blank-line" id="guest-title-line"></span>

        <p class="narrative">
          <span class="i18n" data-zh="蒞臨" data-en="to a State Banquet to be given at">蒞臨</span>
          <span class="accent i18n" data-zh="芬第夏宮" data-en="Findeshia Palace">芬第夏宮</span>
          <span class="i18n" data-zh="，出席由" data-en="by">，出席由</span><br>
          <strong class="i18n" data-zh="赫斯維爾大公殿下" data-en="His Serene Highness the Prince of Hershwell">赫斯維爾大公殿下</strong><br>
          <span class="i18n" data-zh="為慶祝赫斯維爾公國國慶日所設之國宴" data-en="on the auspicious occasion of the National Day of Principality of Hershwell">為慶祝赫斯維爾公國國慶日所設之國宴</span><br>
          <span class="date-line i18n" data-zh="二〇二六年七月三日，星期五，晚間七時三十分" data-en="on Friday, Third July, 2026 at 7:30 p.m.">二〇二六年七月三日，星期五，晚間七時三十分</span>
        </p>

        <div class="card-footer">
          <div class="footer-group">
            <div class="footer-label i18n" data-zh="敬請回覆" data-en="RSVP">敬請回覆</div>
            <div class="i18n" data-zh="請將回覆送交：" data-en="A reply is requested to:">請將回覆送交：</div>
            <div class="i18n" data-zh="宮廷大臣辦公室" data-en="The Grand Chamberlain">宮廷大臣辦公室</div>
            <div class="i18n" data-zh="芬第夏宮" data-en="Findeshia Palace">芬第夏宮</div>
            <div class="i18n" data-zh="雅倫公爵領" data-en="Duchy of Jallon">雅倫公爵領</div>
          </div>
          <div class="footer-divider"><span>◆</span></div>
          <div class="footer-group">
            <div class="footer-label i18n" data-zh="服裝規範" data-en="Dress Code">服裝規範</div>
            <div class="i18n" data-zh="晚禮服" data-en="Evening Dress">晚禮服</div>
            <div class="i18n" data-zh="（白領結或黑領結）" data-en="(White Tie or Black Tie)">（白領結或黑領結）</div>
            <div class="i18n" data-zh="勳章或民族禮服" data-en="Decorations or National Dress">勳章或民族禮服</div>
          </div>
        </div>

        <p class="arrival-note i18n" data-zh="敬請賓客於晚間六時五十分至七時二十分抵達芬第夏宮。" data-en="Guests are asked to arrive at Findeshia Palace between 6:50 and 7:20 p.m.">敬請賓客於晚間六時五十分至七時二十分抵達芬第夏宮。</p>
        <div class="footer-seal">◆ Pro Rege, Pro Domino ◆</div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>

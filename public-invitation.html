<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赫斯維爾國宴 | 公開邀請函</title>
<meta name="description" content="赫斯維爾國宴公開邀請函，敬邀各界友人共襄盛典。">
<meta name="theme-color" content="#6B1722">
<meta property="og:type" content="website">
<meta property="og:title" content="赫斯維爾國宴公開邀請函">
<meta property="og:description" content="謹以大公殿下之名，敬邀各界友人共襄赫斯維爾國宴。">
<meta property="og:url" content="https://paulaustinwang.github.io/state-banquet/public-invitation.html">
<meta property="og:image" content="https://paulaustinwang.github.io/state-banquet/assets/royal-flag.png">
<link rel="canonical" href="https://paulaustinwang.github.io/state-banquet/public-invitation.html">
<link rel="icon" type="image/png" href="assets/state-banquet-nav.png">
<link rel="apple-touch-icon" href="assets/state-banquet-nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="bg-texture"></div>

<main class="public-invitation-wrap">
  <article class="public-invitation fade-up">
    <div class="public-invitation-inner">
      <div class="lang-switch standalone-language" aria-label="語言切換">
        <button type="button" class="lang-btn active" data-lang="zh">中文</button>
        <span class="lang-sep">/</span>
        <button type="button" class="lang-btn" data-lang="en">English</button>
      </div>
      <div class="crest-medallion">
        <img src="assets/state-banquet-crest.png" alt="赫斯維爾國宴徽章" class="crest-img">
      </div>
      <p class="public-kicker">Public Invitation</p>
      <h1 class="public-title i18n" data-zh="國宴公開邀請函" data-en="Public Invitation to the State Banquet">國宴公開邀請函</h1>
      <div class="title-rule"></div>

      <p class="public-copy i18n" data-zh="謹以大公殿下之名，敬邀各界友人蒞臨芬第夏宮，共襄赫斯維爾公國國慶盛典。願諸位以從容之儀、友誼之心入席，同享樂聲、美酒與邦誼。" data-en="In the name of His Serene Highness the Prince of Hershwell, friends from every community are respectfully invited to Findeshia Palace to share in the celebration of the National Day of the Principality of Hershwell. May the evening be marked by grace, friendship, music, and fellowship.">謹以大公殿下之名，敬邀各界友人蒞臨芬第夏宮，共襄赫斯維爾公國國慶盛典。願諸位以從容之儀、友誼之心入席，同享樂聲、美酒與邦誼。</p>

      <span class="public-host i18n" data-zh="赫斯維爾大公殿下" data-en="His Serene Highness the Prince of Hershwell">赫斯維爾大公殿下</span>

      <div class="public-details">
        <div class="public-detail">
          <span class="public-detail-label i18n" data-zh="日期" data-en="Date">日期</span>
          <span class="public-detail-value i18n" data-zh="二〇二六年七月三日，星期五" data-en="Friday, 3 July 2026">二〇二六年七月三日，星期五</span>
        </div>
        <div class="public-detail">
          <span class="public-detail-label i18n" data-zh="時間" data-en="Time">時間</span>
          <span class="public-detail-value i18n" data-zh="晚間七時三十分<br>迎賓時間為六時五十分至七時二十分" data-en="7:30 p.m.<br>Reception from 6:50 to 7:20 p.m.">晚間七時三十分<br>迎賓時間為六時五十分至七時二十分</span>
        </div>
        <div class="public-detail">
          <span class="public-detail-label i18n" data-zh="地點" data-en="Venue">地點</span>
          <span class="public-detail-value i18n" data-zh="芬第夏宮，雅倫公爵領" data-en="Findeshia Palace, Duchy of Jallon">芬第夏宮，雅倫公爵領</span>
        </div>
        <div class="public-detail">
          <span class="public-detail-label i18n" data-zh="著裝" data-en="Dress">著裝</span>
          <span class="public-detail-value i18n" data-zh="正式晚宴服飾；男賓敬請以領結為主" data-en="Formal evening attire; gentlemen are encouraged to wear a bow tie.">正式晚宴服飾；男賓敬請以領結為主</span>
        </div>
        <div class="public-detail">
          <span class="public-detail-label i18n" data-zh="入席禮" data-en="Courtesy">入席禮</span>
          <span class="public-detail-value i18n" data-zh="敬請每位來賓惠攜一瓶美酒" data-en="Each guest is respectfully invited to bring a bottle of wine.">敬請每位來賓惠攜一瓶美酒</span>
        </div>
      </div>

      <p class="public-rsvp">
        <span class="i18n" data-zh="席位以收到宮廷大臣辦公室之確認回覆為準，敬請來信申請出席：" data-en="Attendance is subject to confirmation by the Office of the Grand Chamberlain. Kindly request a place by email:">席位以收到宮廷大臣辦公室之確認回覆為準，敬請來信申請出席：</span><br>
        <a href="mailto:gov.hershwell@gmail.com">gov.hershwell@gmail.com</a><br><br>
        <a class="royal-link i18n" href="https://reurl.cc/Wbjgk7" target="_blank" rel="noopener noreferrer" data-zh="填寫出席表單" data-en="Attendance Form">填寫出席表單</a>
      </p>
      <div class="footer-seal">◆ Pro Rege, Pro Domino ◆</div>
    </div>
  </article>
</main>
<script>
(function(){
  function applyLanguage(lang){
    document.documentElement.lang=lang==='zh'?'zh-Hant':'en';
    document.querySelectorAll('.lang-btn').forEach(function(button){
      button.classList.toggle('active',button.dataset.lang===lang);
    });
    document.querySelectorAll('.i18n').forEach(function(element){
      var text=element.getAttribute('data-'+lang);
      if(text!==null){element.innerHTML=text;}
    });
  }
  document.addEventListener('click',function(event){
    var button=event.target.closest('.lang-btn');
    if(!button){return;}
    localStorage.setItem('publicInvitationLang',button.dataset.lang);
    applyLanguage(button.dataset.lang);
  });
  applyLanguage(localStorage.getItem('publicInvitationLang')||'zh');
  requestAnimationFrame(function(){document.querySelector('.fade-up').classList.add('show');});
})();
</script>
</body>
</html>

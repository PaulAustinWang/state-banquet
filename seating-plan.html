<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赫斯維爾國宴 | 座位表</title>
<meta name="description" content="赫斯維爾國慶國宴正式座位表。">
<meta name="theme-color" content="#6B1722">
<meta property="og:type" content="website">
<meta property="og:title" content="赫斯維爾國宴座位表">
<meta property="og:description" content="芬第夏宮國慶國宴正式長桌席次。">
<meta property="og:url" content="https://paulaustinwang.github.io/state-banquet/seating-plan.html">
<meta property="og:image" content="https://paulaustinwang.github.io/state-banquet/assets/state-banquet-crest.png">
<link rel="canonical" href="https://paulaustinwang.github.io/state-banquet/seating-plan.html">
<link rel="icon" type="image/png" href="assets/state-banquet-nav.png">
<link rel="apple-touch-icon" href="assets/state-banquet-nav.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260703">
<script defer src="assets/js/site.js?v=20260703"></script>
</head>
<body>
<div class="bg-texture"></div>
<header id="site-nav" data-active="seating"></header>

<main class="seating-wrap">
  <section class="seating-card fade-up">
    <header class="seating-header">
      <div class="crest-medallion seating-crest">
        <img src="assets/state-banquet-crest.png" alt="赫斯維爾皇室徽" class="crest-img">
      </div>
      <p class="seating-kicker">Official Table Plan</p>
      <h1 class="page-title i18n" data-zh="國慶國宴座位表" data-en="National Day State Banquet Seating Plan">國慶國宴座位表</h1>
      <p class="page-subtitle i18n" data-zh="芬第夏宮 · 雅倫公爵領" data-en="Findeshia Palace · Duchy of Jallon">芬第夏宮 · 雅倫公爵領</p>
      <div class="title-rule"></div>
    </header>

    <div class="seating-board" aria-label="國宴長桌座位配置">
      <div class="seating-side-label">
        <span class="i18n" data-zh="對側" data-en="Opposite Side">對側</span>
        <span class="i18n" data-zh="六席 · 由左至右" data-en="Six places · left to right">六席 · 由左至右</span>
      </div>
      <div class="seat-row opposite">
        <div class="seat"><span class="seat-number">O1</span><span class="seat-name i18n" data-zh="王先生" data-en="Mr. Gerald Wong">王先生</span></div>
        <div class="seat"><span class="seat-number">O2</span><span class="seat-name i18n" data-zh="吳憶祖閣下" data-en="The Right Honourable Andrew Wu">吳憶祖閣下</span></div>
        <div class="seat home"><span class="seat-number">O3</span><span class="seat-name i18n" data-zh="羅斯維爾公爵" data-en="The Duke of Rushwell">羅斯維爾公爵</span></div>
        <div class="seat"><span class="seat-number">O4</span><span class="seat-name i18n" data-zh="沈雲深殿下" data-en="Prince Ulrich">沈雲深殿下</span></div>
        <div class="seat"><span class="seat-number">O5</span><span class="seat-name i18n" data-zh="舜和殿下" data-en="The Imperial Prince of Guiping">舜和殿下</span></div>
        <div class="seat"><span class="seat-number">O6</span><span class="seat-name i18n" data-zh="邱昱舜閣下" data-en="His Excellency Yu-Shun Chiu">邱昱舜閣下</span></div>
      </div>

      <div class="banquet-table" aria-hidden="true">
        <img src="assets/state-banquet-nav.png" alt="" class="table-seal">
        <div class="table-copy">
          <span class="i18n" data-zh="芬第夏宮 · 國慶國宴" data-en="Findeshia Palace · National Day State Banquet">芬第夏宮 · 國慶國宴</span>
          <strong class="i18n" data-zh="皇家長桌" data-en="The Royal Table">皇家長桌</strong>
        </div>
      </div>

      <div class="seat-row main">
        <div class="seat"><span class="seat-number">M1</span><span class="seat-name i18n" data-zh="德魯特公爵" data-en="The Duke of Druet">德魯特公爵</span></div>
        <div class="seat home"><span class="seat-number">M2</span><span class="seat-name i18n" data-zh="李政翰先生" data-en="Mr. Henry Lee">李政翰先生</span></div>
        <div class="seat home"><span class="seat-number">M3</span><span class="seat-name i18n" data-zh="陳宗佑先生" data-en="Mr. Bonn Chen">陳宗佑先生</span></div>
        <div class="seat host"><span class="seat-number">M4</span><span class="seat-name i18n" data-zh="大公殿下" data-en="His Serene Highness<br>the Prince of Hershwell">大公殿下</span></div>
        <div class="seat home"><span class="seat-number">M5</span><span class="seat-name i18n" data-zh="赫米爾公爵" data-en="The Duke of Hermier">赫米爾公爵</span></div>
        <div class="seat"><span class="seat-number">M6</span><span class="seat-name i18n" data-zh="邵裕先生" data-en="Mr. Shao Yu">邵裕先生</span></div>
        <div class="seat"><span class="seat-number">M7</span><span class="seat-name i18n" data-zh="孛兒只斤·涅爾桂" data-en="Ms. Borjigin Nergui">孛兒只斤·涅爾桂</span></div>
      </div>
      <div class="seating-side-label main">
        <span class="i18n" data-zh="主側" data-en="Principal Side">主側</span>
        <span class="i18n" data-zh="七席 · 由左至右" data-en="Seven places · left to right">七席 · 由左至右</span>
      </div>
    </div>

    <p class="seating-note i18n" data-zh="席位奉大公殿下核定，敬請諸位貴賓依席次入座。" data-en="The seating is appointed by command of His Serene Highness. Honoured guests are respectfully requested to take their designated places.">席位奉大公殿下核定，敬請諸位貴賓依席次入座。</p>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
</body>
</html>

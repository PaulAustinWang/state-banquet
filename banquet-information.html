    <p class="page-subtitle i18n" data-zh="謹列國宴時間、地點與抵達安排，敬請諸位貴賓預先留意。" data-en="The essential time, venue, and arrival arrangements are presented for the convenience of honoured guests.">謹列國宴時間、地點與抵達安排，敬請諸位貴賓預先留意。</p>

    <div class="information-grid">

        <h2 class="i18n" data-zh="日期與時間" data-en="Date and Time">日期與時間</h2>
        <p class="i18n" data-zh="二〇二六年七月三日，星期五<br>國宴於晚間七時三十分開始" data-en="Friday, 3 July 2026<br>The State Banquet commences at 7:30 p.m.">二〇二六年七月三日，星期五<br>國宴於晚間七時三十分開始</p>
      </section>
      <section class="information-item">
        <h2 class="i18n" data-zh="迎賓時間" data-en="Reception Time">迎賓時間</h2>
        <p class="i18n" data-zh="敬請於晚間六時五十分至七時二十分抵達，以利完成迎賓與入席安排。" data-en="Guests are asked to arrive between 6:50 and 7:20 p.m. for reception and seating.">敬請於晚間六時五十分至七時二十分抵達，以利完成迎賓與入席安排。</p>
      </section>
      <section class="information-item full">
        <h2 class="i18n" data-zh="地點與地址" data-en="Venue and Address">地點與地址</h2>
        <p class="i18n" data-zh="芬第夏宮，雅倫公爵領。為維護宮苑秩序，完整門牌、地圖定位與指定禮賓入口將於敬覆出席後，由宮廷大臣辦公室寄送予受邀賓客。" data-en="Findeshia Palace, Duchy of Jallon. To preserve the order of the palace grounds, the full street address, map location, and designated ceremonial entrance will be sent to invited guests by the Office of the Grand Chamberlain following confirmation of attendance.">芬第夏宮，雅倫公爵領。為維護宮苑秩序，完整門牌、地圖定位與指定禮賓入口將於敬覆出席後，由宮廷大臣辦公室寄送予受邀賓客。</p>
      </section>
      <section class="information-item full">
        <h2 class="i18n" data-zh="抵達方式" data-en="Arrival Directions">抵達方式</h2>
        <p class="i18n" data-zh="敬請依宮廷大臣辦公室寄送之地圖定位前往指定禮賓入口。" data-en="Please follow the map location supplied by the Office of the Grand Chamberlain and proceed to the designated ceremonial entrance.">敬請依宮廷大臣辦公室寄送之地圖定位前往指定禮賓入口。</p>
      </section>

      </section>
